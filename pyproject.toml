[project]
name = "kvskip"
version = "0.4.0"
description = "Measurements of decode-time attention sparsity in long-context LLMs, and a CUDA decode kernel that skips KV blocks"
readme = "README.md"
license = "MIT"
requires-python = "==3.11.*"
# Exact versions of every run: requirements.txt (torch comes from the cu126 index).
dependencies = [
    "torch==2.14.1",
    "triton==3.8.0",
    "transformers==5.19.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "huggingface_hub==2.2.0",
    "accelerate==1.15.0",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "scipy==1.17.1",
    "matplotlib==3.11.2",
    "tabulate==0.10.0",
    "ninja==1.13.2",
]

[project.optional-dependencies]
# Built from the sdist with -std=c++20 for sm_80 (README, "Setup"): the FA2 baseline and the lab's prefill.
fa2 = ["flash-attn==2.8.3.post1", "einops==0.8.2", "packaging==26.3", "psutil==7.2.2"]

[tool.uv]
index-strategy = "unsafe-best-match"
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
